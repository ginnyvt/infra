apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ginny-prod
  annotations:
    cert-manager.io/cluster-issuer: zerossl
spec:
  tls:
    - hosts:
        - ginny.dev
      secretName: web-tls
  rules:
    - host: ginny.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
